[package]
name = "wc3gym-overlay"
version = "0.1.0"
description = "Warcraft 3 Gym build-order overlay"
edition = "2021"

[lib]
name = "wc3gym_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wc3gym-overlay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
