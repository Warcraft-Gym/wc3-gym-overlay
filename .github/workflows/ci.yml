name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: test, typecheck, lint, config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run check:config
