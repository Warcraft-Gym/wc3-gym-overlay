name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: test, typecheck, lint, config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run check:config

      # F002a: regression check for the "silent-skip main guard" bug; see
      # scripts/check-space-path-guard.mjs. No network, no node_modules
      # needed; runs on plain node: builtins only.
      - run: node scripts/check-space-path-guard.mjs
